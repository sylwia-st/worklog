expose_php = Off
date.timezone = Europe/Warsaw
memory_limit = 256M
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
realpath_cache_ttl = 600
; php -S nie przekazuje zmiennych środowiskowych do $_SERVER/$_ENV przy domyślnym GPCS –
; bez tego Symfony brałoby DATABASE_URL i APP_SECRET z pliku .env zamiast z kontenera.
variables_order = "EGPCS"
