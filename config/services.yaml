services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Domain/'
            - '../src/Kernel.php'

    App\Service\Settings:
        tags: [{ name: kernel.reset, method: reset }]

    App\Service\WorkCalendar:
        tags: [{ name: kernel.reset, method: reset }]
